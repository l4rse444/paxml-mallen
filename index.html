<style>
/* Design: neutral zinc surfaces, hairline borders, one column of numbered cards. Colour only where it means something (error, warning, ok). */
:root{
  --bg:#f7f7f8; --surface:#ffffff; --fg:#18181b; --muted:#71717a; --line:#e4e4e7; --line-strong:#a1a1aa;
  --soft:#f4f4f5; --accent:#8d0601; --accent-fg:#ffffff; --accent-soft:#f4f4f5; --cta:#18181b; --cta-fg:#ffffff; --cta-hover:#27272a;
  --err:#b91c1c; --err-soft:#fef2f2; --err-line:#fecaca; --warn:#92400e; --warn-soft:#fffbeb; --warn-line:#fde68a; --ok:#15803d; --ok-soft:#f0fdf4; --ok-line:#bbf7d0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:'Geist',-apple-system,'Segoe UI',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-strong:#52525b;
  --soft:#27272a; --accent:#f58e87; --accent-fg:#18181b; --accent-soft:#27272a; --cta:#fafafa; --cta-fg:#18181b; --cta-hover:#e4e4e7;
  --err:#fca5a5; --err-soft:#2a1213; --err-line:#7f1d1d; --warn:#fcd34d; --warn-soft:#271e0a; --warn-line:#78350f; --ok:#86efac; --ok-soft:#0c2014; --ok-line:#14532d; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-strong:#52525b;
  --soft:#27272a; --accent:#f58e87; --accent-fg:#18181b; --accent-soft:#27272a; --cta:#fafafa; --cta-fg:#18181b; --cta-hover:#e4e4e7;
  --err:#fca5a5; --err-soft:#2a1213; --err-line:#7f1d1d; --warn:#fcd34d; --warn-soft:#271e0a; --warn-line:#78350f; --ok:#86efac; --ok-soft:#0c2014; --ok-line:#14532d; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}img{max-width:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));counter-reset:step}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;padding:44px 0 26px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.pill{font-size:13px;color:var(--muted)}
.pill.test{color:var(--warn)}
.brand .sub{display:flex;flex-wrap:wrap;gap:0 8px}
.brand .sub .pill+.pill::before{content:"·";margin-right:8px}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:500;padding:5px 11px;min-height:30px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cta);color:var(--cta-fg)}
.steps{display:none}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:0 0 18px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden}
section.card>:not(h2){margin-left:18px;margin-right:18px}
h2{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
h2::before{counter-increment:step;content:counter(step);flex:none;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--muted);font:600 11px/20px var(--mono);text-align:center}
section.card.done h2::before{content:"✓";background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
p{margin:0}
.muted{color:var(--muted)}
label{font-size:12px;font-weight:500;color:var(--muted)}
.note{border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn{font:inherit;font-size:13px;font-weight:500;min-height:38px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button.btn:hover{background:var(--soft);border-color:var(--line-strong);color:var(--fg)}
button.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-fg);flex:1 1 220px}
button.btn.primary:hover{background:var(--cta-hover);border-color:var(--cta-hover)}
button.btn:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);cursor:not-allowed;opacity:.7}
button.link{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:6px 2px}
button.link:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* drop zone */
button.dropbox{display:flex;flex-direction:column;align-items:center;gap:2px;width:calc(100% - 36px);padding:26px 20px;font:inherit;color:var(--fg);background:transparent;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;text-align:center;transition:border-color .12s,background .12s}
button.dropbox:hover,button.dropbox.drag{border-color:var(--line-strong);background:var(--bg)}
.dropbox .ico{width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.dropbox .t{font-size:13px;font-weight:500}.dropbox .h{font-size:12px;color:var(--muted)}
textarea#paste{width:calc(100% - 36px);min-height:96px;resize:vertical;font:12px/1.5 var(--mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea#paste:focus{outline:none;border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(113,113,122,.15)}
textarea#paste.drag{border-color:var(--line-strong);background:var(--bg)}
.toast{font-size:12px;min-height:18px;color:var(--muted)}
/* status + issues */
.banner{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:1px;font-size:12px}
.banner.bad{background:var(--err-soft);border-color:var(--err-line);color:var(--err)}
.banner.good{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.banner b{font-size:13px;font-weight:600}
.issues{display:flex;flex-direction:column;gap:6px}
.issue{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px}
.issue.err{border-color:var(--err-line);background:var(--err-soft)}
.issue.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.issue .txt{min-width:0;flex:1 1 320px}
.issue.group{align-items:flex-start}
.issue .gact{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.issue .gact .btn{min-height:32px;font-size:12px;padding:4px 10px}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:7px;vertical-align:1px}
.err .tag{color:var(--err)}.warn .tag{color:var(--warn)}
.issue label{display:flex;align-items:center;gap:8px;min-height:32px;white-space:nowrap;color:var(--fg)}
.issue details{margin-top:6px}
.issue summary,details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.issue summary:hover,details summary:hover{color:var(--fg)}
.gl{margin:6px 0 0;padding-left:18px;font-size:12px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.gl button.link{padding:1px 0;font-size:12px;color:var(--accent)}
.mapline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;max-width:520px}
.mapline select,#impDate{font:inherit;font-size:13px;min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:3px 8px}
#impRow label{font-weight:500}
/* table */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
tr.out td{opacity:.5}
td input[type=text]{width:100%;font:12px var(--mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-height:30px}
td input.err{border-color:var(--err);background:var(--err-soft);box-shadow:inset 0 0 0 1px var(--err)}
td input.warn{border:1px dashed var(--warn);background:var(--warn-soft)}
td .norm{font:11px var(--mono);color:var(--muted);padding:2px 2px 0;white-space:nowrap}
td.st{font-size:11px;white-space:nowrap;min-width:150px}
td.st .e{color:var(--err);font-weight:600}td.st .w{color:var(--warn);font-weight:600}td.st .o{color:var(--ok);font-weight:600}
/* summary */
.tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{flex:1 1 140px;padding:13px 15px;background:var(--surface)}
.tile b{display:block;font:600 19px var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.confirm{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:13px;color:var(--fg)}
.confirm span{font-weight:400;color:var(--fg)}
.confirm input{margin-top:3px}
.locked{opacity:.55}
/* sanity check list */
.sanity{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sanity .sh{padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sanity .sr{display:flex;gap:10px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px}
.sanity .sr:last-child{border-bottom:0}
.sanity .mk{flex:none;width:16px;text-align:center;font-weight:600;color:var(--ok)}
.sanity .sr.flag .mk{color:var(--warn)}
.sanity .sk{flex:none;width:120px;color:var(--muted)}
.sanity .sv{flex:1;min-width:0;color:var(--fg)}
@media (max-width:520px){.sanity .sr{flex-wrap:wrap}.sanity .sk{width:auto}}
textarea#xmlout{width:100%;height:220px;margin-top:8px;font:11px/1.5 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
@media (max-width:640px){.tools{align-items:flex-start}header.top{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      </div>
    </div>
  </header>

  <div class="steps" id="steps"></div>

  <section class="card" id="secA">

    <label for="paste" id="lblPaste"></label>

    <input type="file" id="fileIn" accept=".xlsx,.xlsm,.csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values" hidden>

      <button type="button" class="btn primary" id="bCheck"></button>
      <button type="button" class="btn" id="bClear"></button>

      <button type="button" class="link" id="bSample"></button>
      <button type="button" class="link" id="bTemplate"></button>
    </div>
    <p class="muted" style="font-size:12px" id="pHint"></p>
    <div class="toast muted" id="toastA" role="status"></div>
  </section>

  <section class="card" id="secB" hidden>
    <h2 id="hB"></h2>
    <div class="row" id="impRow"><label for="impDate" id="lblImp"></label><input type="date" id="impDate"></div>
    <p class="muted" style="font-size:12px" id="pImp"></p>
    <div id="banner"></div>
    <div class="issues" id="issues"></div>
    <div class="row"><button type="button" class="btn" id="bReport" hidden></button></div>
    <div class="row" style="justify-content:space-between">
      <label class="row" style="gap:8px;min-height:40px"><input type="checkbox" id="onlyProblems"><span id="lblOnly" style="font-weight:500"></span></label>

    </div>
    <p class="muted" style="font-size:12px" id="legend"></p>
    <div class="row"><button type="button" class="btn" id="bList"></button></div>
    <div class="tablebox"><table id="tbl"></table></div>
  </section>

  <section class="card" id="secC" hidden>
    <h2 id="hC"></h2>
    <p class="muted" id="pC"></p>
    <div class="tiles" id="tiles"></div>
    <div class="sanity" id="sanity"></div>
    <label class="confirm"><input type="checkbox" id="chkConfirm"><span id="lblConfirm"></span></label>
    <div class="row">
      <button type="button" class="btn primary" id="bSave"></button>
      <button type="button" class="btn" id="bCopy"></button>
      <span class="muted" style="font-size:12px" id="fname"></span>
    </div>
    <div class="toast" id="toastC" role="status"></div>
    <details><summary id="sumXml"></summary><textarea id="xmlout" readonly aria-label="PAXml"></textarea></details>
    <p class="muted" style="font-size:12px" id="pLimits"></p>
  </section>

  <footer id="foot"></footer>
</div>

  var sst=[],sx=await zText(files,'xl/sharedStrings.xml');
  if(sx){var si=xml(sx).getElementsByTagName('si');for(i=0;i<si.length;i++){var ts=si[i].getElementsByTagName('t'),str='';for(var j=0;j<ts.length;j++){if(ts[j].parentNode.nodeName!=='rPh')str+=ts[j].textContent}sst.push(str)}}
  var sheet=xml(await zText(files,path)),rowsEl=sheet.getElementsByTagName('row'),out=[],maxc=0;
  for(i=0;i<rowsEl.length;i++){
    var cs=rowsEl[i].getElementsByTagName('c'),cells=[],rn=parseInt(rowsEl[i].getAttribute('r'),10);
    for(j=0;j<cs.length;j++){
      var c=cs[j],ref=c.getAttribute('r'),ci=ref?colIdx(ref):cells.length,ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0],val='';
      if(ty==='s')val=v?(sst[parseInt(v.textContent,10)]||''):'';
      else if(ty==='inlineStr')val=Array.prototype.map.call(c.getElementsByTagName('t'),function(x){return x.textContent}).join('');
      else if(ty==='b')val=v&&v.textContent==='1'?'TRUE':'FALSE';
      else if(ty==='e')val='';
      else{val=v?v.textContent:'';if(/^-?\d+\.0+$/.test(val))val=val.replace(/\.0+$/,'')}
      cells[ci]=String(val).replace(/[\t\r\n]+/g,' ');if(ci+1>maxc)maxc=ci+1}
    var ri=(rn||out.length+1)-1;while(out.length<ri)out.push([]);out[ri]=cells}
  var lines=out.map(function(r){var a=[];for(var k=0;k<maxc;k++)a.push(r[k]===undefined?'':r[k]);return a.join('\t')});
  while(lines.length&&!lines[lines.length-1].replace(/\t/g,'').trim())lines.pop();
  return {tsv:lines.join('\n'),sheet:sh.getAttribute('name')||''}}
function readFile(f){
  var t=T();if(!f)return;
  if(/\.(xlsx|xlsm)$/i.test(f.name)){
    if(f.size>20*1024*1024||typeof DecompressionStream==='undefined'){$('toastA').textContent=t.fileBad;return}
    f.arrayBuffer().then(readXlsx).then(function(x){
      if(!x.tsv.trim()){$('toastA').textContent=t.fileBad;return}
      $('paste').value=x.tsv;$('bCheck').click();$('toastA').textContent=t.xlsRead(f.name,x.sheet)+' '+$('toastA').textContent
    }).catch(function(){$('toastA').textContent=t.fileBad});return}
  if(/\.(xls|ods|numbers)$/i.test(f.name)){$('toastA').textContent=t.fileXls;return}
  if(f.size>5*1024*1024){$('toastA').textContent=t.fileBad;return}
  var r=new FileReader();
  r.onerror=function(){$('toastA').textContent=t.fileBad};
  r.onload=function(){
    var b=r.result,txt;
    try{txt=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){try{txt=new TextDecoder('windows-1252').decode(b)}catch(e2){$('toastA').textContent=t.fileBad;return}}
    if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
    if(txt.indexOf('\u0000')>-1||!txt.trim()){$('toastA').textContent=t.fileBad;return}
    $('paste').value=txt;$('bCheck').click();
    if($('toastA').textContent)$('toastA').textContent=t.fileRead(f.name)+' '+$('toastA').textContent}
  r.readAsArrayBuffer(f)}

(function(){var zs=[$('bFile'),$('paste')];
  function has(e){var d=e.dataTransfer;return d&&Array.prototype.indexOf.call(d.types||[],'Files')>-1}
  zs.forEach(function(z){
    ['dragenter','dragover'].forEach(function(ev){z.addEventListener(ev,function(e){if(!has(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy';z.classList.add('drag')})});
    z.addEventListener('dragleave',function(e){if(!z.contains(e.relatedTarget))z.classList.remove('drag')});
    z.addEventListener('drop',function(e){if(!has(e))return;e.preventDefault();z.classList.remove('drag');readFile(e.dataTransfer.files[0])})});
  /* a file dropped outside the box must not make the browser open it and leave the tool */
  ['dragover','drop'].forEach(function(ev){window.addEventListener(ev,function(e){if(has(e))e.preventDefault()})})
})();

function eachWarn(code,fn){rows.forEach(function(r,i){if(!r.inc)return;results[i].iss.forEach(function(x){if(x.lvl==='w'&&x.code===code&&!x.acked)fn(r,x)})})}

function csvCell(v){v=String(v==null?'':v).replace(/\r?\n/g,' ');if(/^[=+\-@\t]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function buildReport(){
  var t=T(),out=[t.repCols.map(csvCell).join(';')];
  rows.forEach(function(r,i){if(!r.inc)return;var res=results[i],nm=((res.v.fornamn||r.raw.fornamn||'')+' '+(res.v.efternamn||r.raw.efternamn||'')).trim();
    res.iss.forEach(function(x){
      var msg=t.m[x.code]?t.m[x.code](x.p):(t.et[x.code]||t.gt[x.code]||x.code);
      out.push([x.lvl==='e'?t.err:t.warn,res.rowNo,r.raw.anstnr||'',nm,colLabel(x.col),msg,r.raw[x.col]||'',x.lvl==='e'?t.repOpen:(x.acked?t.repAck:t.repOpen)].map(csvCell).join(';'))})});
  return '\uFEFF'+out.join('\r\n')+'\r\n'}

function buildList(){

    out.push(KEYS.map(function(k){return r.raw[k]}).concat([st,r.inc?t.listYes:t.listNo]).map(csvCell).join(';'))});
