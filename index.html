<style>
/* Layout: one working column, three stacked stages (paste, fix, check and save); wide table scrolls inside its own box. */
:root{
  --bg:#f2f2f6; --surface:#ffffff; --fg:#282425; --muted:#6a5e5b; --line:#dcdce4;
  --accent:#8d0601; --accent-fg:#ffffff; --accent-soft:#ffdcd9; --cta:#f26961; --cta-fg:#282425;
  --err:#a8261d; --err-soft:#fde4e1; --warn:#7a4f00; --warn-soft:#fbf0d9; --ok:#243860; --ok-soft:#e4f0f9;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1819; --surface:#282425; --fg:#faf4ec; --muted:#c4b8b4; --line:#4a4244;
  --accent:#f58e87; --accent-fg:#282425; --accent-soft:#3a2523; --cta:#f26961; --cta-fg:#282425;
  --err:#ff9b92; --err-soft:#3a1f1c; --warn:#f0c46a; --warn-soft:#38301a; --ok:#abd1ea; --ok-soft:#1f2c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1819; --surface:#282425; --fg:#faf4ec; --muted:#c4b8b4; --line:#4a4244;
  --accent:#f58e87; --accent-fg:#282425; --accent-soft:#3a2523; --cta:#f26961; --cta-fg:#282425;
  --err:#ff9b92; --err-soft:#3a1f1c; --warn:#f0c46a; --warn-soft:#38301a; --ok:#abd1ea; --ok-soft:#1f2c40; color-scheme:dark}
*{box-sizing:border-box}
.issue.group{align-items:flex-start}
.issue .gact{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.issue details{margin-top:8px}.issue summary{cursor:pointer;font-size:13px;color:var(--accent)}
.gl{margin:6px 0 0;padding-left:18px;font-size:13px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.gl button.link{padding:2px 0;font-size:13px}
.mapline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;max-width:520px}
.mapline select,#impDate{font:inherit;font-size:14px;min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);padding:4px 8px}

body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);background:var(--surface)}
.pill.test{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;padding:7px 12px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;color:var(--muted);min-width:0}
.step strong{display:block;color:var(--fg);font-weight:600;font-size:14px}
.step small{font-size:12px}
.step.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.done strong{color:var(--ok)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.note{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:6px;padding:10px 14px;font-size:14px}
textarea#paste{width:100%;min-height:150px;resize:vertical;font:13px/1.4 var(--mono);color:var(--fg);background:var(--bg);border:1px dashed var(--muted);border-radius:6px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.btn{font:inherit;font-weight:500;min-height:42px;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
button.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-fg);font-weight:600}
button.btn:disabled{border-color:var(--line);background:var(--bg);color:var(--muted);cursor:not-allowed}
button.link{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:6px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px solid var(--line);border-left-width:5px;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.banner.bad{border-left-color:var(--err);background:var(--err-soft)}
.banner.good{border-left-color:var(--ok);background:var(--ok-soft)}
.banner b{font-size:16px;font-weight:600}
.issues{display:flex;flex-direction:column;gap:8px}
.issue{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-left-width:5px;border-radius:6px;padding:10px 14px;font-size:14px}
.issue.err{border-left-color:var(--err);background:var(--err-soft)}
.issue.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.issue .txt{min-width:0;flex:1 1 320px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;border:1px solid currentColor;border-radius:3px;padding:0 6px;margin-right:8px}
.err .tag{color:var(--err)}.warn .tag{color:var(--warn)}
.issue label{display:flex;align-items:center;gap:8px;min-height:36px;white-space:nowrap}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:560px;overflow-y:auto}
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
th{position:sticky;top:0;background:var(--accent-soft);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
tr.out td{opacity:.5}
td input[type=text]{width:100%;font:13px var(--mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 6px;min-height:32px}
td input.err{border:2px solid var(--err);background:var(--err-soft)}
td input.warn{border:2px dashed var(--warn);background:var(--warn-soft)}
td .norm{font:11px var(--mono);color:var(--muted);padding:2px 2px 0;white-space:nowrap}
td.st{font-size:12px;white-space:nowrap;min-width:150px}
td.st .e{color:var(--err);font-weight:600}td.st .w{color:var(--warn);font-weight:600}td.st .o{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--bg)}
.tile.key{border:2px solid var(--fg)}
.tile b{display:block;font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--bg)}
.confirm input{margin-top:4px}
.locked{opacity:.55}
details summary{cursor:pointer;font-size:13px;color:var(--accent)}
textarea#paste.drag{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
#dropz{position:relative}
#dropz .dropmsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-weight:600;color:var(--accent);pointer-events:none;border-radius:6px}
#dropz.drag .dropmsg{display:flex}
#dropz.drag textarea{color:transparent}
textarea#xmlout{width:100%;height:220px;margin-top:8px;font:12px/1.4 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
.toast{font-size:13px;min-height:20px}
footer{font-size:12px;color:var(--muted)}
@media (max-width:640px){.steps{grid-template-columns:1fr}.step small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>PAXml-mallen</b><span class="pill test" id="pillTest"></span><span class="pill" id="pillTarget"></span></div>
    <div class="tools">
      <span id="offline"></span>
      <div class="seg" role="group" aria-label="Språk / Language">
        <button type="button" id="lsv" aria-pressed="true">SV</button><button type="button" id="len" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="steps" id="steps"></div>

  <section class="card" id="secA">
    <h2 id="hA"></h2>
    <div class="note" id="noteTest"></div>
    <label for="paste" id="lblPaste" style="font-weight:600"></label>
    <div id="dropz"><textarea id="paste" spellcheck="false"></textarea><div class="dropmsg" id="dropMsg" aria-hidden="true"></div></div>
    <input type="file" id="fileIn" accept=".xlsx,.xlsm,.csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values" hidden>
    <div class="row">
      <button type="button" class="btn primary" id="bCheck"></button>
      <button type="button" class="btn" id="bFile"></button>
      <button type="button" class="btn" id="bSample"></button>
      <button type="button" class="btn" id="bTemplate"></button>
      <button type="button" class="link" id="bClear"></button>
    </div>
    <p class="muted" style="font-size:13px" id="pHint"></p>
    <div class="toast muted" id="toastA" role="status"></div>
  </section>

  <section class="card" id="secB" hidden>
    <h2 id="hB"></h2>
    <div class="row" id="impRow"><label for="impDate" id="lblImp" style="font-weight:600"></label><input type="date" id="impDate"></div>
    <p class="muted" style="font-size:13px" id="pImp"></p>
    <div id="banner"></div>
    <div class="issues" id="issues"></div>
    <div class="row" style="justify-content:space-between">
      <label class="row" style="gap:8px;min-height:40px"><input type="checkbox" id="onlyProblems"><span id="lblOnly" style="font-weight:500"></span></label>
      <span class="muted" style="font-size:13px" id="shown"></span>
    </div>
    <p class="muted" style="font-size:13px" id="legend"></p>
    <div class="tablebox"><table id="tbl"></table></div>
  </section>

  <section class="card" id="secC" hidden>
    <h2 id="hC"></h2>
    <p class="muted" id="pC"></p>
    <div class="tiles" id="tiles"></div>
    <label class="confirm"><input type="checkbox" id="chkConfirm"><span id="lblConfirm"></span></label>
    <div class="row">
      <button type="button" class="btn primary" id="bSave"></button>
      <button type="button" class="btn" id="bCopy"></button>
      <span class="muted" style="font-size:13px" id="fname"></span>
    </div>
    <div class="toast" id="toastC" role="status"></div>
    <details><summary id="sumXml"></summary><textarea id="xmlout" readonly aria-label="PAXml"></textarea></details>
    <p class="muted" style="font-size:13px" id="pLimits"></p>
  </section>

  <footer id="foot"></footer>
</div>

  ['dragover','drop'].forEach(function(ev){window.addEventListener(ev,function(e){if(has(e))e.preventDefault()})})
})();
$('bSample').onclick=function(){var t=T();$('paste').value='';load(sampleRows(),t.loaded(14))};
$('bClear').onclick=function(){$('paste').value='';rows=[];results=[];acks={};$('secB').hidden=true;$('secC').hidden=true;$('toastA').textContent='';renderSteps()};
$('bTemplate').onclick=async function(){
  var t=T(),dl=await getDl();if(!dl){$('toastA').textContent=t.saveNA;return}
  var head=COLS.map(function(c){return c[1].sv}).join(';');
  try{await dl.save({filename:'paxml-mall.csv',data:'﻿'+head+'\n'});$('toastA').textContent=t.templateSaved}catch(e){$('toastA').textContent=(e&&e.code==='declined')?t.declined:t.saveNA}};
$('onlyProblems').onchange=function(){renderTable()};
$('chkConfirm').onchange=function(){renderTotals()};
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.k){var r=rows.filter(function(q){return q.id==el.dataset.r})[0];if(r){r.raw[el.dataset.k]=el.value;refresh(false)}}
  else if(el.dataset&&el.dataset.inc){var r2=rows.filter(function(q){return q.id==el.dataset.inc})[0];if(r2){r2.inc=el.checked;refresh(false)}}
  else if(el.dataset&&el.dataset.ack){acks[el.dataset.ack]=el.checked;refresh(false)}
  else if(el.dataset&&el.dataset.amap){if(el.value){anstMap[el.dataset.amap]=el.value;refresh(true)}}
  else if(el.id==='impDate'){impDate=el.value||todayStr();refresh(true)}});
function eachWarn(code,fn){rows.forEach(function(r,i){if(!r.inc)return;results[i].iss.forEach(function(x){if(x.lvl==='w'&&x.code===code&&!x.acked)fn(r,x)})})}
document.addEventListener('click',function(e){
  var bt=e.target.closest&&e.target.closest('[data-ackgroup],[data-excgroup],[data-exc]');
  if(bt){
    if(bt.dataset.ackgroup){eachWarn(bt.dataset.ackgroup,function(r,x){acks[x.id]=true});refresh(true)}
    else if(bt.dataset.excgroup){var ids=[];eachWarn(bt.dataset.excgroup,function(r){ids.push(r)});ids.forEach(function(r){r.inc=false});refresh(true)}
    else if(bt.dataset.exc){rows.forEach(function(r){if(r.id==bt.dataset.exc)r.inc=false});refresh(true)}
    return}
  var b=e.target.closest&&e.target.closest('[data-goto]');
  if(b){var inp=$(b.dataset.goto);if(!inp){ $('onlyProblems').checked=false;renderTable();inp=$(b.dataset.goto)}if(inp){inp.scrollIntoView({block:'center',inline:'center'});inp.focus()}}});
async function getDl(){try{return window.claude&&claude.use?await claude.use('downloads'):null}catch(e){return null}}
$('bSave').onclick=async function(){
  var t=T(),dl=await getDl();
  if(!dl){ /* normal web page: a plain download, saved as .xml */
    try{var bl=new Blob([buildXml()],{type:'application/xml;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');
      a.href=u;a.download=fileName().replace(/\.txt$/,'.xml');document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
      $('toastC').textContent=t.savedXml}catch(e){$('toastC').textContent=t.saveNA}
    return}
  try{await dl.save({filename:fileName(),data:buildXml()});$('toastC').textContent=t.saved}
  catch(e){$('toastC').textContent=(e&&e.code==='declined')?t.declined:t.saveNA}};
$('bCopy').onclick=function(){
  var t=T(),ta=$('xmlout'),txt=ta.value;
  var fallback=function(){var d=document.querySelector('details');d.open=true;ta.focus();ta.select();$('toastC').textContent=t.copyFail};
  try{navigator.clipboard.writeText(txt).then(function(){$('toastC').textContent=t.copied},fallback)}catch(e){fallback()}};

setStatic();renderSteps();
})();
</script>
